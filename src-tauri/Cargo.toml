[package]
name = "bd-activity-tracker"
version = "0.1.0"
description = "BD Activity Tracker — desktop app for logging sales activities"
authors = []
edition = "2021"

[lib]
name = "bd_activity_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
